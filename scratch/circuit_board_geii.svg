    <line x1="24" y1="55" x2="24" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="30" y1="55" x2="30" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="36" y1="55" x2="36" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="42" y1="55" x2="42" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="24" y1="77" x2="24" y2="81" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="30" y1="77" x2="30" y2="81" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="36" y1="77" x2="36" y2="81" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="42" y1="77" x2="42" y2="81" stroke="#9ecfaa" stroke-width="1.5"/>
