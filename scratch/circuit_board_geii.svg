    <rect x="90" y="15" width="8" height="16" rx="1" fill="#4a7a9b" stroke="#3a5a7b" stroke-width="1"/>
    <line x1="94" y1="12" x2="94" y2="15" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="94" y1="31" x2="94" y2="34" stroke="#9ecfaa" stroke-width="1.5"/>
    <rect x="420" y="15" width="8" height="16" rx="1" fill="#4a7a9b" stroke="#3a5a7b" stroke-width="1"/>
    <line x1="424" y1="12" x2="424" y2="15" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="424" y1="31" x2="424" y2="34" stroke="#9ecfaa" stroke-width="1.5"/>
  </g>

  <!-- Central white circle with GEII text -->
  <circle cx="260" cy="190" r="115" fill="white" opacity="0.97"/>
  <circle cx="260" cy="190" r="115" fill="none" stroke="#8bb193" stroke-width="3" opacity="0.5"/>
  <circle cx="260" cy="190" r="108" fill="none" stroke="#d4e6d8" stroke-width="1" opacity="0.6"/>

  <!-- GEII Bordeaux text -->
  <text x="260" y="188" text-anchor="middle" font-family="'Outfit', 'Arial', sans-serif" font-weight="900" font-size="62" fill="#2d5038" letter-spacing="-1">GEII</text>
  <text x="260" y="231" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" font-weight="500" font-size="22" fill="#3f604c" letter-spacing="1">Bordeaux</text>

  <!-- Corner decorations -->
  <circle cx="15" cy="15" r="8" fill="none" stroke="#7ab88a" stroke-width="2" opacity="0.5"/>
  <circle cx="15" cy="15" r="4" fill="#9ecfaa" opacity="0.5"/>
  <circle cx="505" cy="15" r="8" fill="none" stroke="#7ab88a" stroke-width="2" opacity="0.5"/>
  <circle cx="505" cy="15" r="4" fill="#9ecfaa" opacity="0.5"/>
  <circle cx="15" cy="365" r="8" fill="none" stroke="#7ab88a" stroke-width="2" opacity="0.5"/>
  <circle cx="15" cy="365" r="4" fill="#9ecfaa" opacity="0.5"/>
  <circle cx="505" cy="365" r="8" fill="none" stroke="#7ab88a" stroke-width="2" opacity="0.5"/>
