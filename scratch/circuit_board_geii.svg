  <!-- Diagonal traces -->
  <g stroke="#7ab88a" stroke-width="1.5" fill="none" opacity="0.4">
    <line x1="60" y1="120" x2="90" y2="150"/>
    <line x1="110" y1="100" x2="140" y2="130"/>
    <line x1="160" y1="130" x2="190" y2="160"/>
    <line x1="360" y1="130" x2="330" y2="160"/>
    <line x1="410" y1="100" x2="380" y2="130"/>
    <line x1="460" y1="115" x2="430" y2="145"/>
    <line x1="60" y1="260" x2="90" y2="230"/>
    <line x1="110" y1="280" x2="140" y2="250"/>
    <line x1="160" y1="250" x2="190" y2="220"/>
    <line x1="360" y1="250" x2="330" y2="220"/>
    <line x1="410" y1="280" x2="380" y2="250"/>
