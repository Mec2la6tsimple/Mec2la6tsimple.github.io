  <g opacity="0.7">
    <rect x="468" y="55" width="32" height="22" rx="3" fill="#1e3a28" stroke="#5a8a6a" stroke-width="1"/>
    <line x1="472" y1="55" x2="472" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="478" y1="55" x2="478" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="484" y1="55" x2="484" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="490" y1="55" x2="490" y2="51" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="472" y1="77" x2="472" y2="81" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="478" y1="77" x2="478" y2="81" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="484" y1="77" x2="484" y2="81" stroke="#9ecfaa" stroke-width="1.5"/>
