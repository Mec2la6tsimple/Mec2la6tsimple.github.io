    <rect x="15" y="175" width="30" height="10" rx="2" fill="#c8a050" stroke="#a07830" stroke-width="1"/>
    <line x1="10" y1="180" x2="15" y2="180" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="45" y1="180" x2="50" y2="180" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="22" y1="180" x2="22" y2="180" stroke="#8b3a3a" stroke-width="2"/>
    <line x1="30" y1="180" x2="30" y2="180" stroke="#c88040" stroke-width="2"/>
    <line x1="38" y1="180" x2="38" y2="180" stroke="#3a6a3a" stroke-width="2"/>
  </g>

  <!-- Resistors right side -->
  <g opacity="0.6">
    <rect x="475" y="175" width="30" height="10" rx="2" fill="#c8a050" stroke="#a07830" stroke-width="1"/>
    <line x1="470" y1="180" x2="475" y2="180" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="505" y1="180" x2="510" y2="180" stroke="#9ecfaa" stroke-width="1.5"/>
