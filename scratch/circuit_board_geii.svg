<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5a8a6a"/>
      <stop offset="100%" stop-color="#2d5038"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="380" fill="url(#bgGrad)" rx="14"/>

  <!-- PCB traces - horizontal -->
  <g stroke="#7ab88a" stroke-width="2" fill="none" opacity="0.55">
    <line x1="0" y1="40" x2="140" y2="40"/>
    <line x1="380" y1="40" x2="520" y2="40"/>
    <line x1="0" y1="90" x2="80" y2="90"/>
    <line x1="430" y1="90" x2="520" y2="90"/>
    <line x1="0" y1="140" x2="120" y2="140"/>
    <line x1="400" y1="140" x2="520" y2="140"/>
    <line x1="0" y1="240" x2="110" y2="240"/>
    <line x1="410" y1="240" x2="520" y2="240"/>
    <line x1="0" y1="290" x2="90" y2="290"/>
    <line x1="430" y1="290" x2="520" y2="290"/>
    <line x1="0" y1="340" x2="150" y2="340"/>
    <line x1="370" y1="340" x2="520" y2="340"/>
    <line x1="0" y1="190" x2="95" y2="190"/>
    <line x1="425" y1="190" x2="520" y2="190"/>
  </g>

  <!-- PCB traces - vertical -->
  <g stroke="#7ab88a" stroke-width="2" fill="none" opacity="0.55">
    <line x1="60" y1="0" x2="60" y2="120"/>
    <line x1="60" y1="260" x2="60" y2="380"/>
    <line x1="110" y1="0" x2="110" y2="100"/>
    <line x1="110" y1="280" x2="110" y2="380"/>
    <line x1="160" y1="0" x2="160" y2="130"/>
    <line x1="160" y1="250" x2="160" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="130"/>
    <line x1="360" y1="250" x2="360" y2="380"/>
    <line x1="410" y1="0" x2="410" y2="100"/>
    <line x1="410" y1="280" x2="410" y2="380"/>
    <line x1="460" y1="0" x2="460" y2="115"/>
    <line x1="460" y1="265" x2="460" y2="380"/>
