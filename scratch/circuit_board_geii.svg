    <rect x="22" y="307" width="41" height="41" rx="2" fill="#243d2e"/>
    <line x1="22" y1="305" x2="22" y2="300" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="30" y1="305" x2="30" y2="300" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="38" y1="305" x2="38" y2="300" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="46" y1="305" x2="46" y2="300" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="54" y1="305" x2="54" y2="300" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="22" y1="355" x2="22" y2="360" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="30" y1="355" x2="30" y2="360" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="38" y1="355" x2="38" y2="360" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="46" y1="355" x2="46" y2="360" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="54" y1="355" x2="54" y2="360" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="15" y1="312" x2="10" y2="312" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="15" y1="322" x2="10" y2="322" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="15" y1="332" x2="10" y2="332" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="15" y1="342" x2="10" y2="342" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="70" y1="312" x2="75" y2="312" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="70" y1="322" x2="75" y2="322" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="70" y1="332" x2="75" y2="332" stroke="#9ecfaa" stroke-width="1.5"/>
    <line x1="70" y1="342" x2="75" y2="342" stroke="#9ecfaa" stroke-width="1.5"/>
