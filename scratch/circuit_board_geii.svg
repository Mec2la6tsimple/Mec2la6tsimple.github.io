    <circle cx="60" cy="90" r="5"/>
    <circle cx="110" cy="90" r="4"/>
    <circle cx="60" cy="140" r="5"/>
    <circle cx="160" cy="140" r="4"/>
    <circle cx="60" cy="190" r="4"/>
    <circle cx="110" cy="190" r="5"/>
    <circle cx="60" cy="240" r="5"/>
    <circle cx="160" cy="240" r="4"/>
    <circle cx="60" cy="290" r="4"/>
    <circle cx="110" cy="290" r="5"/>
    <circle cx="60" cy="340" r="5"/>
    <circle cx="160" cy="340" r="4"/>
    <circle cx="460" cy="40" r="5"/>
    <circle cx="410" cy="40" r="4"/>
    <circle cx="460" cy="90" r="5"/>
    <circle cx="410" cy="90" r="4"/>
    <circle cx="460" cy="140" r="4"/>
    <circle cx="360" cy="140" r="5"/>
